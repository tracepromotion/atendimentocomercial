<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Atendimento</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(90deg, #000000, #00e676, #000000);
      background-size: 300% 300%;
      animation: gradientFlow 6s ease infinite;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      color: white;
      font-weight: bold;
      font-size: 24px;
      margin: 0;
      letter-spacing: 1px;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
  flex: 1;
  display: flex;
  background-color: #2e7d32;
  padding: 20px;
  box-sizing: border-box;
  gap: 20px;

  position: relative;
}

    .sidebar {
      width: 300px;
      background-color: #1b5e20;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-radius: 8px;
      height: fit-content;
    }

    .sidebar button {
      background-color: transparent;
      color: white;
      border: 2px solid white;
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
      text-align: left;
      transition: background 0.3s;
      border-radius: 5px;
    }

    .sidebar button:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .message-box {
  display: none;
  background-color: white;
  border-radius: 8px;
  padding: 5px;
  box-sizing: border-box;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);

  max-width: 700px;
  width: 100%;

  position: absolute;
  left: 340px;
  top: 0;

  max-height: 80vh;
  overflow-y: auto;
}

    @keyframes slideIn {
      from { transform: translateX(-30px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .controls {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
      margin-bottom: 5px;
    }

    .controls button {
      background-color: #e0e0e0;
      border: none;
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
    }

    .message-content {
  white-space: pre-wrap;
  font-size: 16px;
  color: #333;
  padding: 5px;
}
  </style>
</head>
<body>

  <header>
    <h1>ATENDIMENTO TRACECOM</h1>
  </header>

  <div class="container">
    <div class="sidebar">
      <button onclick="showMessage(0, this)">Saudação + Imagem</button>
      <button onclick="showMessage(1, this)">Cliente demorando</button>
      <button onclick="showMessage(2, this)">Follow up</button>
      <button onclick="showMessage(3, this)">Follow up 2</button>
      <button onclick="showMessage(4, this)">Follow up 3</button>
      <button onclick="showMessage(5, this)">Follow up 4</button>
      <button onclick="showMessage(6, this)">Follow Pós Plano</button>
      <button onclick="showMessage(7, this)">Confirmação do Plano</button>
      <button onclick="showMessage(8, this)">Vencimento da Fatura</button>
      <button onclick="showMessage(9, this)">Fidelidade Explicação</button>
      <button onclick="showMessage(10, this)">Horário Marcado</button>
      <button onclick="showMessage(11, this)">Sem Viabilidade</button>
      <button onclick="showMessage(12, this)">Coleta de Dados</button>
      <button onclick="showMessage(13, this)">Análise de Crédito</button>
      <button onclick="showMessage(14, this)">Análise Reprovada</button>
      <button onclick="showMessage(15, this)">Motivo da Reprovação</button>
      <button onclick="showMessage(16, this)">Agendamento p/ Amanhã</button>
      <button onclick="showMessage(17, this)">Agendamento para 48h</button>
      <button onclick="showMessage(18, this)">Confirmação do Agendamento</button>
      <button onclick="showMessage(19, this)">Trace Canais</button>
      <button onclick="showMessage(20, this)">Jornada DC</button>
      <button onclick="showMessage(21, this)">Pós Venda</button>
      <button onclick="showMessage(22, this)">Lembrete 1</button>
    </div>

    <div class="message-box" id="messageBox">
      <div class="controls">
        <button onclick="copyText()">Copiar</button>
        <button onclick="closeBox()">Fechar</button>
      </div>
      <div class="message-content" id="messageContent"></div>
    </div>
  </div>

  <script>
    const messages = [
      `Olá, tudo bem ? 
Segue abaixo os planos disponíveis em sua região:`,

      `Conseguiu dar uma olhada em nossos planos ? Caso tenha ficado alguma dúvida ou queira que eu te indique o melhor plano para o seu consumo, é só me falar, ok ?
      Nossa promoção está imperdível e com um desconto que não encontrará em nenhum outro lugar, mas é por tempo limitado, então não deixe de aproveitar ! 😊`,

      `Olá, tudo bem ? 

Por gentileza, consegue nos tirar uma dúvida para melhorarmos nossas ofertas... ?

Dos planos que te apresentei, qual chamou mais sua atenção até agora: o que entrega mais velocidade ou o que oferece o melhor custo-benefício?`,

      `Percebi que você analisou os planos mas acabou não me dizendo qual deles ficou mais próximo do que você procura.

Foi o valor, os benefícios inclusos ou a velocidade que te deixou em dúvida?`,

      `Fiquei com uma dúvida depois de te enviar os planos...

O que pesou mais para você até agora: o valor da mensalidade, os benefícios inclusos ou a velocidade da internet?
Dependendo da sua resposta, consigo te indicar qual das opções faz mais sentido para o seu perfil.`,

      `Estou organizando e finalizando alguns atendimento e notei que você ainda não definiu qual plano gostaria.

Antes que eu atualize seu atendimento, queria saber: algum dos planos que te apresentei faz sentido para o que você procura hoje?`,

      `Oi...

Vi aqui que você já havia demonstrado interesse em seguir com o plano escolhido, mas acabamos não concluindo as próximas etapas.

Ficou pendente alguma dúvida ou foi apenas a correria do dia a dia? 😊`,

      `Perfeito! Então sua escolha será o plano de XXMB + XX por R$ XX,XX com fidelidade. Correto ? 
Só confirma aqui pra gente, por gentileza😊`,

      `O vencimento corresponde a data da instalação, por exemplo, se a internet for instalada amanhã (DATA) o vencimento da fatura será todo dia X dos próximos meses. Lembrando que o cliente pode solicitar a mudança de vencimento após o pagamento da primeira fatura, e a primeira fatura vence só 30 dias após a instalação.`,

      `Entendo perfeitamente sua colocação, e até por isso gosto de explicar com clareza: a fidelidade não é algo exclusivo nosso, ela existe em praticamente todas as grandes operadoras do país justamente para garantir condições melhores para o cliente.
É através dela que é possível negociar benefícios, promoções e descontos para os clientes. 

E reforçando: a qualidade e a entrega do nosso serviço não estão atreladas a isso, prova disso são as avaliações no Google de clientes satisfeitos que continuam conosco até mesmo após o período de fidelidade.`,

      `Não conseguimos agendar horário exato, pois se trata de um serviço externo e imprevistos podem acontecer durante o dia, como trânsito, incidentes ou atrasos em outras visitas.


Para ajudar, avisamos cerca de 1 hora antes da chegada do técnico, dando tempo para o cliente se deslocar até o condomínio. Podemos prosseguir dessa forma? 😊`,

      `No momento ainda não atendemos seu condomínio, mas temos interesse em avaliar a viabilidade de implantação na região.

Para isso, poderia nos enviar as informações abaixo?

• Nome do solicitante:
• Bloco e apartamento:
• Nome do condomínio:
• Endereço completo:
• Data de lançamento do condomínio (mês/ano):
• Nome e contato do síndico ou subsíndico:

Com essas informações, nossa equipe poderá realizar uma análise e, havendo viabilidade, a própria Direção fará contato com os responsáveis para que sejamos autorizados a atuar no condomínio.

Agradecemos pelo seu interesse em nossos serviços e aguardamos o seu retorno!`,

      `Ótimo! Agora para realizarmos o seu cadastro e agendamento basta nos enviar os seus seguintes dados: 
-Nome Completo:
-CPF:
-Data de Nascimento:
-Gênero:
-Bloco e Apto.:
-E-mail:
-Contato para Ligação:
-Segundo contato:
-Apto. Próprio ou Alugado ?
-Se alugado, qual tempo de moradia ?`,

      `Recebemos os dados enviados e já iniciamos a análise cadastral necessária para dar continuidade à sua solicitação.
Em alguns minutos retorno com o resultado da aprovação e a confirmação do agendamento.`,

      `Olá, tudo bem?
Antes de qualquer coisa, obrigado pelo interesse em contratar a Tracecom.

Concluímos a análise cadastral referente aos dados enviados e, neste momento, não foi possível seguir para a próxima etapa da contratação.
Sabemos que situações como essa podem acontecer e nem sempre refletem o momento atual de uma pessoa. Por esse motivo, queremos apresentar duas alternativas que podem ajudar você a continuar o processo.

✅ Você pode encaminhar os dados de outro titular para realizarmos uma nova análise.
✅ Ou solicitar uma nova avaliação em até 90 dias, quando uma nova consulta poderá ser efetuada.

Nosso objetivo é encontrar a melhor forma de atender você e esperamos ter a oportunidade de recebê-lo como cliente em breve.

Permanecemos à disposição para ajudar no que for necessário.`,

      `Compreendo perfeitamente sua pergunta.

A análise realizada segue uma série de critérios internos de validação e o resultado é retornado de forma automática pelo sistema. Por questões de segurança e confidencialidade, os detalhes que compõem essa avaliação não ficam disponíveis para nossa equipe.

A boa notícia é que isso não significa que as possibilidades se encerram por aqui.

Você pode encaminhar os dados de outro titular para uma nova análise ou solicitar uma reavaliação em 60 a 90 dias. Muitas situações podem mudar nesse período e uma nova consulta poderá apresentar um resultado diferente.

Se desejar, posso dar continuidade agora mesmo por uma dessas alternativas.`,

      `Obrigado! Em relação a sua instalação conseguimos um Encaixe para *amanhã em horário Comercial (9h às 18h)* Pode ser ?`,

      `Olha, a data mais próxima que temos aqui é com prazo muito longo, porém conversei com a Supervisão e conseguimos um Encaixe para [DATA] em horário Comercial, pode ser ?`,

      `Instalação agendada para: [DIA} (X/X). 
Período: [PERÍODO] (Xh às Xh). 
Protocolo: [X]

-Lembrando que a sua data de vencimento é de acordo com sua data de instalação.  

-Por favor, é necessário ter um maior de 18 anos no local para acompanhar o técnico no momento da instalação, tirar dúvidas e realizar testes em seus dispositivos. 

Caso tenha algum imprevisto que lhe impeça de receber o técnico, nos informe para que a visita seja cancelada, por gentileza.

⚠️ Importante: O limite de espera para o dia do seu agendamento (visita técnica, instalação e Retirada de equipamentos) é de: 15 (quinze) minutos.

Caso o técnico chegue e o local não esteja liberado ou a pessoa responsável não esteja disponível após esse período, o agendamento poderá ser automaticamente reagendado, sujeitando-se à nova disponibilidade na agenda.`,

      `Segue abaixo os detalhes do TRACE CANAIS, *nossa TV por aplicativo*, incluso gratuitamente no seu plano.
No material você verá os canais disponíveis, TVs compatíveis e como acessar.`,

      `⚠️Segue abaixo um conteúdo com as principais coisas que você precisa saber sobre seu Plano, Fatura e Conexão: 
ATENÇÃO: É importante que assista até o final para evitar dúvidas futuras.`,

      `Olá, Sr(a). XXXX, tudo bem ? 
Estou entrando em contato para verificar se ocorreu tudo bem na instalação. Gostaria de deixar alguma reclamação ou elogio para o Técnico ou Empresa ?

Além disso gostaria de reforçar que a sua fatura vence 30 dias após a instalação, e a fatura chegará 10 dias antes do vencimento no e-mail cadastrado, Ok ? 
Caso queira mudar o vencimento, basta realizar o pagamento da primeira fatura e retornar o contato aqui para solicitar a mudança do vencimento com o setor "Financeiro". 

E qualquer dúvida, problema ou solicitação, o nosso Suporte Remoto funciona 24h todos os dias, não exite em nos mandar mensagem neste mesmo número independente da hora, Ok ?`,

      `🗓️ Sua instalação é hoje! Já está tudo certo por aí?

Passando para te lembrar que o técnico está com sua visita programada para hoje 👨‍🔧
É importante que tenha alguém disponível no local durante o período combinado no agendamento, pois não conseguimos especificar o horário exato da chegada.

⏱️ Importante: o técnico pode aguardar no máximo 15 minutos caso não seja atendido na portaria.

🚨Se surgir algum imprevisto, pode me avisar por aqui. Nessas situações, tentamos contato quando o técnico estiver a caminho ou realizamos o reagendamento, se necessário.

Esse lembrete é só um cuidado nosso pra garantir que tudo dê certo e você tenha a melhor experiência desde o início 💜

Qualquer coisa, estou por aqui!`
    ];

    function showMessage(index, button) {

  const box = document.getElementById('messageBox');
  const content = document.getElementById('messageContent');
  const container = document.querySelector('.container');

  content.textContent = messages[index];
  box.style.display = 'block';

  requestAnimationFrame(() => {

    // Centro vertical do botão clicado
    const buttonCenter =
      button.offsetTop + (button.offsetHeight / 2);

    // Centro vertical da caixa
    const boxCenter =
      box.offsetHeight / 2;

    // Alinha centro da caixa com centro do botão
    let top = buttonCenter - boxCenter;

    // Evita que a caixa ultrapasse o topo
    if (top < 0) {
      top = 0;
    }

    // Evita que a caixa ultrapasse a parte inferior da área verde
    const maxTop = container.offsetHeight - box.offsetHeight;

    if (top > maxTop) {
      top = maxTop;
    }

    box.style.top = top + 'px';
  });
}

function closeBox() {
  const box = document.getElementById('messageBox');
  box.style.display = 'none';
}

function copyText() {
  const text = document.getElementById('messageContent').textContent;

  navigator.clipboard.writeText(text).then(() => {
    alert("Texto copiado com sucesso!");
  });
}

    function copyText() {
      const text = document.getElementById('messageContent').textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert("Texto copiado com sucesso!");
      });
    }
  </script>
</body>
</html>
